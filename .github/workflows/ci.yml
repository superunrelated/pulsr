name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      # mcp-server is a standalone package (own package.json/lockfile,
      # deliberately not an npm workspace member), so it needs its own install.
      - run: npm ci
        working-directory: mcp-server
      - run: npx nx run-many -t lint test build typecheck
